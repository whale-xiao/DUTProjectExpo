# 网关配置：一个 nginx 进程托管两个前端，并把 /api 与 /uploads 反代给后端。
#
# 开发期由 Vite dev server 代理这两条路径（见各 frontend-*/vite.config.js），
# 生产期换成这里，前端代码里的相对路径 /api/… 无需任何改动。

upstream backend_api {
    server backend:8080;
}

# ── 前台展示站 ── http://localhost
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/showcase;
    index index.html;
    charset utf-8;

    # 后端上传上限 5MB，这里留一倍余量
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # 带哈希指纹的构建产物可长期缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # history 模式的 SPA 回退：/project/3 这类深链刷新不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── 管理后台 ── http://localhost:8081
server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html/admin;
    index index.html;
    charset utf-8;

    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # /login、/projects/3/edit 等后台深链同样需要回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
